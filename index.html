<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Shayaali ❤️</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/welcome.css">
</head>
<body>

<!-- ================= LOADER ================= -->

<div id="loader">

    <div class="loader-heart">💖</div>

    <h2>Creating Something Magical...</h2>

    <div class="loading-bar">
        <span></span>
    </div>

</div>

<!-- =============== BACKGROUND ================= -->

<div class="gradient-bg"></div>

<div id="particles"></div>

<!-- =============== MUSIC ================= -->

<div class="music-player">

    <button id="musicBtn">

        ♫

    </button>

</div>

<audio
id="bgMusic"
loop>

<source src="The Neighbourhood - Reflections (Lyrics).mp3" type="audio/mpeg">

</audio>

<!-- =============== MAIN ================= -->

<section class="main">

<div class="glass-card">

    <h3 class="welcome">

        Welcome 🌸

    </h3>

    <h1>

        Shayaali's Birthday Surprise

    </h1>

    <!-- Countdown -->

    <div class="countdown">

        <div>

            <span id="days">00</span>

            <small>Days</small>

        </div>

        <div>

            <span id="hours">00</span>

            <small>Hours</small>

        </div>

        <div>

            <span id="minutes">00</span>

            <small>Minutes</small>

        </div>

        <div>

            <span id="seconds">00</span>

            <small>Seconds</small>

        </div>

    </div>

    <p class="countText">

        Until Your Birthday 🎂

    </p>

    <!-- Password -->

    <div class="password-box">

        <input

        type="password"

        id="password"

        placeholder="Enter Your Nickname">

        <button id="unlock">

            Unlock 💖

        </button>

    </div>

    <p id="error"></p>

</div>

</section>

<!-- Transition -->

<div id="transition"></div>

<script src="js/welcome.js"></script>
<script src="js/particles.js"></script>
<script src="js/cursor.js"></script>
<script src="js/music.js"></script>


</body>
</html>
